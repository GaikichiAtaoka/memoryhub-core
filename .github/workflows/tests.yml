name: synthetic-tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install self-contained package
        run: python -m pip install -e .
      - name: Run synthetic-source tests
        run: python -m unittest discover -s tests -v
      - name: Smoke test explicit demo
        run: |
          python -m memoryhub --base examples/synthetic_workspace index
          python -m memoryhub --base examples/synthetic_workspace search "library book"
          python -m memoryhub --base examples/synthetic_workspace day 2026-10-10
      - name: Offline chatbot integration example
        run: python examples/agent_integration.py --query "青い本はもう借りましたか？" > /dev/null
