[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "memoryhub-local-core"
version = "0.2.0a1"
description = "Source-first memory retrieval and explicit memory lifecycle management for local AI"
readme = "README.md"
requires-python = ">=3.11"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "MemoryHub contributors"}]
keywords = ["memory", "local-ai", "sqlite", "provenance", "temporal-retrieval", "memory-lifecycle"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.urls]
Repository = "https://github.com/GaikichiAtaoka/memoryhub-core"
Documentation = "https://github.com/GaikichiAtaoka/memoryhub-core/blob/main/README.md"
Issues = "https://github.com/GaikichiAtaoka/memoryhub-core/issues"

[project.scripts]
memoryhub = "memoryhub.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
