[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "memoryhub-local-core"
version = "0.1.0"
description = "Source-first, read-only temporal memory retrieval for self-hosted local AI"
readme = "README.md"
requires-python = ">=3.11"
license = "PolyForm-Noncommercial-1.0.0"
authors = [{name = "MemoryHub contributors"}]
keywords = ["memory", "local-ai", "sqlite", "provenance", "temporal-retrieval"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.scripts]
memoryhub = "memoryhub.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
